  <div class="login-page">
    <div class="login-caja">

      <div class="login-header">
        <h1>Pulpería</h1>
        <p class="login-subtitulo">Iniciá sesión para continuar</p>
      </div>

      <form class="form-login" (submit)="$event.preventDefault(); login()">

        <div class="form-campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ej. maria" (input)="idSignal.set(txtID.value)" #txtID />
        </div>

        <div class="form-campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" placeholder="••••••••" (input)="passwordSignal.set(txtPassword.value)" #txtPassword/>
        </div>

        <!-- si el login falla, mostrar en su lugar: -->
        <!-- <p class="form-error">Usuario o contraseña incorrectos.</p> -->

        <button type="submit" class="btn-ingresar">Ingresar</button>

        @if (errorMessage().length>1) {
          <div>
            <span>{{errorMessage()}}</span>
          </div>
        }
      </form>

    </div>
  </div>
