   <div class="modal-overlay">
    <div class="modal-caja" role="dialog" aria-labelledby="titulo-modal">

      <div class="modal-header">
        <h2 id="titulo-modal">Editar producto</h2>

      </div>

      <form class="form-producto" (submit)="$event.defaultPrevented;actualizar()">

        <div class="form-campo">
          <label for="nombre-producto">Nombre del producto</label>
          <input type="text" id="nombre-producto" [value]="name()" placeholder="Ej. Arroz 1kg" required (input)="name.set(txtName.value)" #txtName/>
        </div>

        <div class="form-campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" (change)="categoria.set(txtCategoria.value)" #txtCategoria>
            <option  disabled>Seleccionar categoría...</option>
            <option selected>{{categoria()}}</option>
            <option>Lácteos</option>
            <option>Panadería</option>
            <option>Otra</option>
          </select>
        </div>

        <div class="form-campo">
          <label for="precio">Precio (₡)</label>
          <input type="number" id="precio" [value]="price()" placeholder="850" required (input)="price.set(txtPrice.valueAsNumber)" #txtPrice/>
        </div>


        <div class="campo-imagen">
            <label class="zona-imagen" for="imagen">
            <input id="imagen" class="entrada-oculta" type="file" accept="image/*" required (change)="onImageSelected($event)" #image/>

            <span class="miniatura">
              <svg class="icono" viewBox="0 0 24 24" width="24" height="24" fill="none"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <circle cx="9" cy="10" r="1.5" />
                <path d="m21 16-5-5-8 8" />
              </svg>
            </span>

            <span class="texto-imagen">
              Arrastre la foto aquí o haga clic para elegirla
              <small>PNG o JPG, hasta 2 MB</small>
            </span>
          </label>

          <div class="fila-imagen">
            @if (Image()) {
              <button type="button" class="boton-quitar" (click)="quitarImagen(image)">Quitar foto</button>
            }
          </div>
        </div>

        <div class="modal-acciones">
          <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn-guardar" >Actualizar producto</button>
        </div>

        <!-- Solo aparece cuando el producto ya existe -->
        <div class="restock-seccion">
          <p class="restock-titulo">Reabastecer</p>
          <p class="restock-actual">Stock actual: <strong>{{stock()}}</strong></p>

          <div class="restock-fila">
            <input type="number" min="1" placeholder="Ej. 24" (input)="newStock.set(txtStock.valueAsNumber)" #txtStock/>
            <button type="button" class="btn-restock" (click)="ActualizarStock()">Agregar stock</button>
          </div>
        </div>

        <div>
          @if (cargando()===false&& errorMensaje().length>0) {
            <span>Se requiere todos los campos</span>
          }
        </div>

      </form>

    </div>
  </div>
