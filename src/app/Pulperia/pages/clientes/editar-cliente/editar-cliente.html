  <div class="modal-overlay">
    <div class="modal-caja" role="dialog" aria-labelledby="titulo-modal">

      <div class="modal-header">
        <h2 id="titulo-modal">Editar cliente</h2>
      </div>

      <div class="form-cliente">

        <div class="form-campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" [value]="fullName()" placeholder="Ej. María Jiménez" (input)="fullName.set(txtName.value)" #txtName/>
        </div>

        <div class="form-campo">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" [value]="idParam" placeholder="1-2345-6789" disabled #txrId />
        </div>

        <div class="form-campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" [value]="phone()" placeholder="8888-8888" (input)="phone.set(txtphone.value)" #txtphone />
        </div>

        <div class="form-campo">
          <label for="limite">Límite de fiado (₡)</label>
          <input type="number" id="limite" [value]="creditLimit()" placeholder="20000" min="0" (input)="creditLimit.set(txtCreditLimit.valueAsNumber)" #txtCreditLimit />
        </div>

        <!-- Solo lectura: el saldo se calcula en base a las compras del cliente, no se edita acá -->
        <div class="saldo-info">
          <span class="saldo-label">Saldo pendiente actual</span>
          <span class="saldo-valor">{{UsedCredit() | number}} </span>
        </div>

        <div class="modal-acciones">
          <button type="button" class="btn-cancelar" (click)="Cancelar()">Cancelar</button>
          <button type="button" class="btn-guardar" (click)="updateClient()">Actualizar cliente</button>
        </div>

        @if (updating()===false && errorMessageUpdate().length>0) {
          <span>{{errorMessageUpdate()}}</span>
        }

      </div>



    </div>
  </div>
